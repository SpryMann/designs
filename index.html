<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои проекты</title>
    <link rel="stylesheet" href="/reset.css" />
    <style>
      body {
        font-family: 'Lexend', sans-serif;
        background: #0a0a0a;
        color: #ffffff;
        min-height: 100vh;
        padding: 2rem;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 3rem;
        margin-bottom: 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
      }
      .project-card {
        background: #1a1a1a;
        border-radius: 1rem;
        padding: 1.5rem;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        border: 1px solid #2a2a2a;
        text-decoration: none;
        color: white;
      }
      .project-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        border-color: #667eea;
      }
      .project-card h2 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      .project-card p {
        color: #888;
        font-size: 0.9rem;
      }
      .project-card .tag {
        display: inline-block;
        background: #2a2a2a;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Мои проекты</h1>
      <div class="projects-grid" id="projects"></div>
    </div>

    <script type="module">
      const base = import.meta.env.BASE_URL || '/';
      const projects = [
        {
          name: 'Fitness App',
          path: 'projects/01-fitness-app/index.html',
          description: 'Трекер тренировок с колесиком выбора',
          tags: ['TypeScript', 'CSS'],
        },
        {
          name: 'Dropdowns',
          path: 'projects/02-dropdowns/index.html',
          description: 'Выпадающие списки',
          tags: ['TypeScript', 'CSS'],
        },
        {
          name: 'Date time picker',
          path: 'projects/03-dropdowns/index.html',
          description: 'Календарь с выбором даты и времени',
          tags: ['TypeScript', 'CSS'],
        },
      ];

      const grid = document.getElementById('projects');
      projects.forEach((project) => {
        const card = document.createElement('a');
        card.href = `${base}${project.path}`;
        card.className = 'project-card';
        card.innerHTML = `
                <h2>${project.name}</h2>
                <p>${project.description}</p>
                <div>
                    ${project.tags.map((tag) => `<span class="tag">${tag}</span>`).join('')}
                </div>
            `;
        grid.appendChild(card);
      });
    </script>
  </body>
</html>
