<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | Fitness App</title>
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav__link nav__link--active" href="#" aria-label="Home page">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="7" height="7" x="3" y="3" rx="1" />
          <rect width="7" height="7" x="14" y="3" rx="1" />
          <rect width="7" height="7" x="14" y="14" rx="1" />
          <rect width="7" height="7" x="3" y="14" rx="1" />
        </svg>
      </a>
      <a class="nav__link" href="#" aria-label="Calendar page">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 2v4" />
          <path d="M16 2v4" />
          <rect width="18" height="18" x="3" y="4" rx="2" />
          <path d="M3 10h18" />
        </svg>
      </a>
      <a class="nav__link" href="#" aria-label="Statistics page">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 21v-6" />
          <path d="M12 21V3" />
          <path d="M19 21V9" />
        </svg>
      </a>
      <a class="nav__link" href="#" aria-label="Chats page">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"
          />
        </svg>
      </a>
    </nav>
    <div class="container page">
      <header class="page-header">
        <h1 class="page-header__title">Workouts</h1>
        <div class="page-header__buttons">
          <button class="icon-button" type="button" aria-label="Open settings">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M10 5H3" />
              <path d="M12 19H3" />
              <path d="M14 3v4" />
              <path d="M16 17v4" />
              <path d="M21 12h-9" />
              <path d="M21 19h-5" />
              <path d="M21 5h-7" />
              <path d="M8 10v4" />
              <path d="M8 12H3" />
            </svg>
          </button>
          <button class="icon-button" type="button" aria-label="Open settings">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
        </div>
      </header>
      <main class="main">
        <div class="tiles">
          <div class="tile">
            <div class="tile__content">
              <div class="progress" style="--progress: 34%">
                <p class="progress__text">1</p>
              </div>
            </div>
            <div class="tile__text">
              <p class="tile__heading">Chest + tricep</p>
              <p class="tile__subheading">Fridays</p>
            </div>
            <button
              class="tile__button"
              type="button"
              aria-label="Workout settings"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M10 5H3" />
                <path d="M12 19H3" />
                <path d="M14 3v4" />
                <path d="M16 17v4" />
                <path d="M21 12h-9" />
                <path d="M21 19h-5" />
                <path d="M21 5h-7" />
                <path d="M8 10v4" />
                <path d="M8 12H3" />
              </svg>
            </button>
          </div>
          <div class="tile">
            <div class="tile__content">
              <p class="weight">
                <span class="weight__highlight">190</span>
                lbs
              </p>
            </div>
            <div class="tile__text">
              <p class="tile__heading">Body weight</p>
              <p class="tile__subheading">31 min ago</p>
            </div>
            <button
              class="tile__button"
              id="weightSettingsButton"
              type="button"
              aria-label="Workout settings"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M10 5H3" />
                <path d="M12 19H3" />
                <path d="M14 3v4" />
                <path d="M16 17v4" />
                <path d="M21 12h-9" />
                <path d="M21 19h-5" />
                <path d="M21 5h-7" />
                <path d="M8 10v4" />
                <path d="M8 12H3" />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <div class="drawer" id="drawer">
      <div class="drawer__handle"></div>
      <div class="drawer-header drawer__header">
        <div class="drawer-header__top">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14" />
            <path d="m19 12-7 7-7-7" />
          </svg>
          <div class="drawer-header__buttons">
            <button
              class="icon-button"
              type="button"
              aria-label="Open settings"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M10 5H3" />
                <path d="M12 19H3" />
                <path d="M14 3v4" />
                <path d="M16 17v4" />
                <path d="M21 12h-9" />
                <path d="M21 19h-5" />
                <path d="M21 5h-7" />
                <path d="M8 10v4" />
                <path d="M8 12H3" />
              </svg>
            </button>
            <button class="button" type="button">Log</button>
          </div>
        </div>
        <div class="drawer-header__bottom">
          <h2 class="drawer-header__title">Weight</h2>
          <p class="drawer-header__subtitle">Add a new log</p>
        </div>
      </div>
      <div class="drawer__content">
        <div class="drawer-section">
          <p class="drawer-section__title">Kilos</p>
          <div class="wheel-pickers">
            <div class="wheel-picker" id="kgWheelPicker"></div>
            <div class="wheel-picker" id="gWheelPicker"></div>
          </div>
        </div>
        <div class="drawer-section">
          <p class="drawer-section__title">Recent logs</p>
          <div class="weight-logs">
            <div class="weight-log">
              <div class="icon-button">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 3v1" />
                  <path d="M12 20v1" />
                  <path d="M3 12h1" />
                  <path d="M20 12h1" />
                  <path d="m18.364 5.636-.707.707" />
                  <path d="m6.343 17.657-.707.707" />
                  <path d="m5.636 5.636.707.707" />
                  <path d="m17.657 17.657.707.707" />
                </svg>
              </div>
              <div class="weight-log__texts">
                <p class="weight-log__heading">9.5 kg</p>
                <p class="weight-log__text">
                  17:11 &middot; Yesterday &middot; 14 Aug
                </p>
              </div>
              <svg
                class="weight-log__chevron"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./Drawer.ts"></script>
    <script src="./WheelPicker.ts"></script>
    <script src="./app.ts"></script>
  </body>
</html>
